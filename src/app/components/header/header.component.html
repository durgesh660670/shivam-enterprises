<!-- Main Header -->
<header class="main-header">
  <div class="container header-container">
    <!-- Brand Info -->
    <a href="#/" class="brand-wrapper">
      <div class="brand-logo-icon">S</div>
      <div>
        <div class="brand-name">Shivam Enterprises</div>
        <div class="brand-tagline">Polyester & Cotton Bra Cups Manufacturer, Mumbai</div>
      </div>
    </a>

    <!-- Live Search -->
    <div class="header-search">
      <form class="search-input-group" onsubmit="event.preventDefault(); window.headerComponent.onSearchSubmit();">
        <input 
          type="text" 
          id="header-search-input"
          class="search-input" 
          placeholder="Search Bra Cups, Sweat Pads, Lingerie Accessories..."
          autocomplete="off"
          oninput="window.headerComponent.onSearchChange(this.value)"
        />
        <button type="submit" class="search-submit-btn" title="Search">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </button>
      </form>
    </div>

    <!-- Quick Call & Action -->
    <div class="header-contact-actions">
      <a href="tel:07949323547" class="call-box" title="Click to call">
        <span class="call-number">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
          </svg>
          07949323547
        </span>
        <span class="call-subtext">89% Response Rate</span>
      </a>

      <button class="btn btn-primary" onclick="window.enquiryService.openEnquiryModal()">
        <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
        </svg>
        Send Inquiry
      </button>
    </div>
  </div>
</header>
