<div style="background: #ffffff; border-bottom: 1px solid var(--gray-200); padding: 30px 0;">
  <div class="container">
    <div style="font-size: 0.85rem; color: var(--gray-500); margin-bottom: 10px;">
      <a href="#/">Home</a> &gt; <span>Testimonials</span>
    </div>
    <h1 style="font-size: 2rem; color: var(--gray-900);">Customer Testimonials & Reviews</h1>
    <p class="text-muted">Real reviews from garment manufacturers and wholesale buyers across India</p>
  </div>
</div>

<section class="section">
  <div class="container">
    <!-- Rating summary -->
    <div class="rating-summary-card">
      <div class="rating-score-box">
        <div class="big-rating-number">3.8</div>
        <div>
          <div class="rating-stars">&#9733;&#9733;&#9733;&#9733;&#9734;</div>
          <div style="font-size: 0.88rem; color: var(--gray-600); margin-top: 4px;">Based on 8 Verified Reviews</div>
          <div style="font-size: 0.78rem; color: #059669; font-weight: 600; margin-top: 2px;">100% User Satisfaction &amp; Quality</div>
        </div>
      </div>

      <div class="rating-bars">
        <div class="rating-bar-row">
          <span>5 Star</span>
          <div class="rating-bar-track"><div class="rating-bar-fill" style="width: 50%;"></div></div>
          <span>4</span>
        </div>
        <div class="rating-bar-row">
          <span>4 Star</span>
          <div class="rating-bar-track"><div class="rating-bar-fill" style="width: 0%;"></div></div>
          <span>0</span>
        </div>
        <div class="rating-bar-row">
          <span>3 Star</span>
          <div class="rating-bar-track"><div class="rating-bar-fill" style="width: 37%;"></div></div>
          <span>3</span>
        </div>
        <div class="rating-bar-row">
          <span>2 Star</span>
          <div class="rating-bar-track"><div class="rating-bar-fill" style="width: 0%;"></div></div>
          <span>0</span>
        </div>
        <div class="rating-bar-row">
          <span>1 Star</span>
          <div class="rating-bar-track"><div class="rating-bar-fill" style="width: 13%;"></div></div>
          <span>1</span>
        </div>
      </div>

      <button class="btn btn-primary" onclick="window.enquiryService.openEnquiryModal()">
        Submit Inquiry / Feedback
      </button>
    </div>

    <!-- Reviews Grid -->
    <div class="grid grid-cols-2 gap-6" id="testimonials-grid">
      <!-- Injected via TestimonialsComponent -->
    </div>
  </div>
</section>
